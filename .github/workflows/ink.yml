# Paints the contribution graph as an ink brush stroke, pushed to the `output` branch.
name: ink

on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }

permissions:
  contents: write

jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/ink-light.svg?color_snake=#1B1B2F&color_dots=#EDE6DA,#F2C6B8,#E98F73,#E4572E,#9E2F14
            dist/ink-dark.svg?color_snake=#F4EFE6&color_dots=#1E1E2A,#5A2A20,#9E2F14,#E4572E,#F29B80

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
